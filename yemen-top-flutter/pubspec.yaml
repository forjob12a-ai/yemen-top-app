name: yemen_top
description: تطبيق يمن توب للخدمات الرقمية — شحن الألعاب والبطاقات.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  http: ^1.2.0                 # الاتصال بالـ API
  provider: ^6.1.2             # إدارة الحالة
  shared_preferences: ^2.2.3   # تخزين التوكن واختيار العملة محلياً
  intl: 0.20.2                # تنسيق الأرقام والتواريخ
  google_fonts: ^6.2.1         # خطوط Cairo / Tajawal
  cached_network_image: ^3.3.1 # صور المنتجات
  url_launcher: ^6.3.0         # فتح روابط واتساب والروابط الخارجية
  google_sign_in: ^7.2.0       # الدخول بحساب جوجل
  lottie: ^3.1.0               # أنميشن شاشة البداية
  # إشعارات Push (اختياري — يتطلب إعداد Firebase):
  # firebase_core: ^2.31.0
  # firebase_messaging: ^14.9.0

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/animations/yemen-top-portal.json

